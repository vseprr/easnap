name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v1.1.0 or v1.1.0-beta.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate the release tag and notes
    runs-on: windows-latest
    steps:
      - name: Validate tag format
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$') {
            throw 'Use an existing vMAJOR.MINOR.PATCH tag, optionally with a prerelease label such as -beta.1.'
          }

      - name: Check out the tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Match the tag to the project version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $source = Get-Content -LiteralPath CMakeLists.txt -Raw
          if ($source -notmatch 'project\(Easnap\s+VERSION\s+(\d+\.\d+\.\d+)') {
            throw 'Cannot read the CMake project version.'
          }
          $version = $matches[1]
          if ($source -notmatch '(?m)^set\(EASNAP_VERSION_PRERELEASE\s+"([0-9A-Za-z.]*)"\)') {
            throw 'Cannot read the prerelease label.'
          }
          if ($matches[1]) { $version = "$version-$($matches[1])" }
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "The tag does not match the project version v$version."
          }
          $notes = "docs/releases/$env:RELEASE_TAG.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) {
            throw "Missing release notes: $notes"
          }

  build:
    name: Build, test and package
    needs: validate
    uses: ./.github/workflows/build.yml
    with:
      ref: refs/tags/${{ inputs.tag }}
    permissions:
      contents: read

  draft:
    name: Create a draft release
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Download the tested Release package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: easnap-windows-x64
          path: dist/releases

      # The checksum files are produced by the same job as the packages, so
      # they detect corruption only. The attestation ties each file to this
      # workflow run: gh attestation verify <file> --repo vseprr/easnap
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/releases/*.zip
            dist/releases/*-setup.exe

      - name: Verify checksum and create draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $assets = @()
          # The symbol files are published with the release: a crash report can
          # only be read with the symbols of the build that wrote it.
          foreach ($package in @("Easnap-$env:RELEASE_TAG-windows-x64.zip", "Easnap-$env:RELEASE_TAG-windows-x64-setup.exe",
                                 "Easnap-$env:RELEASE_TAG-windows-x64-symbols.zip")) {
            $file = "dist/releases/$package"
            $checksum = "$file.sha256"
            $line = (Get-Content -LiteralPath $checksum -Raw).Trim()
            if ($line -notmatch '^([a-f0-9]{64})  (.+)$' -or $matches[2] -ne $package) {
              throw "Invalid checksum file for $package."
            }
            if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant() -ne $matches[1]) {
              throw "The downloaded $package does not match its checksum."
            }
            $assets += @($file, $checksum)
          }
          # A tag with a label is a prerelease: GitHub does not offer it as
          # the latest release.
          $kind = @()
          if ($env:RELEASE_TAG -match '-') { $kind = @('--prerelease') }
          gh release create $env:RELEASE_TAG @assets @kind --verify-tag --draft --title "Easnap $env:RELEASE_TAG" --notes-file "docs/releases/$env:RELEASE_TAG.md"
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }

      - name: Report the remaining publication review
        shell: pwsh
        run: |
          @'
          ### Draft release created
          The ZIP, installer and symbol files passed the hosted build, test and packaging checks.
          Physical desktop tests are pending outside this hosted workflow.
          Review local desktop evidence, compatibility limits and release notes
          before publishing the draft. The binaries are unsigned.
          '@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

