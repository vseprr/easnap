name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: false
        type: string
        default: ''

# Easnap only ever builds on Windows: the product is a Win32 desktop
# application and the CMake project rejects other platforms on purpose.
permissions:
  contents: read

concurrency:
  group: build-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned: the build uses the Visual Studio 17 2022 generator, and the image
    # behind windows-latest moves on to newer Visual Studio versions.
    name: ${{ matrix.configuration }} (windows-2022)
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      # Third-party actions are pinned to a commit; a moved tag cannot change
      # what runs here. The token is not left in the checkout.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Show toolchain versions
        shell: pwsh
        run: |
          cmake --version
          Write-Host "Runner image: $env:ImageOS"

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022" -A x64
          -DEASNAP_WARNINGS_AS_ERRORS=ON
          -DEASNAP_BUILD_TESTS=ON

      # Warnings are errors for project code, so this step is also the
      # static-quality gate required by the delivery plan.
      - name: Build
        shell: pwsh
        run: cmake --build build --config ${{ matrix.configuration }} --parallel

      # Unit, integration and private-desktop tests. Excluded here, and still
      # required locally: visible-desktop tests (no real display or input
      # queue), soak variants, preview tests (the hosted Windows Server image
      # cannot open an MFPlay player) and the overlay interaction test, whose
      # click targets assume a larger desktop than the runner's.
      - name: Test on the hosted runner
        shell: pwsh
        working-directory: build
        run: >-
          ctest --build-config ${{ matrix.configuration }}
          --output-on-failure --parallel 4 --no-tests=error
          --label-exclude "interactive-desktop|desktop-visual|soak|preview"
          --exclude-regex "^capture_overlay_interaction$"

      - name: Report pending physical desktop validation
        if: always()
        shell: pwsh
        run: |
          @'
          ### Physical desktop validation is pending
          Hosted CI excludes tests labeled interactive-desktop, desktop-visual, soak
          or preview, and capture_overlay_interaction.
          These remain registered and must be run on an unlocked Windows desktop:
          ./scripts/test.ps1 -Tier Full   (or -Tier Soak for the long repeats)
          A passing hosted run is not a full desktop or hardware compatibility result.
          '@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Verify the application and preview helper were produced
        shell: pwsh
        run: |
          foreach ($name in @('Easnap.exe', 'EasnapPreviewHost.exe')) {
            $exe = "build/bin/${{ matrix.configuration }}/$name"
            if (-not (Test-Path -LiteralPath $exe)) { throw "Missing build output: $exe" }
            Get-Item -LiteralPath $exe | Select-Object Name, Length, VersionInfo | Format-List
          }

      - name: Ensure Inno Setup is available
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $known = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              -not ($known | Where-Object { Test-Path -LiteralPath $_ })) {
            choco install innosetup --version=6.7.3 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Installing Inno Setup failed.' }
          }

      - name: Package the Release build
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: ./scripts/package-release.ps1 -BuildDir build -OutputDir dist/releases -Installer Require

      - name: Upload artifact
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: easnap-windows-x64
          path: |
            dist/releases/*.zip
            dist/releases/*-setup.exe
            dist/releases/*.sha256
          if-no-files-found: error
          retention-days: 14

  # The same tests under AddressSanitizer. A separate build: the sanitizer
  # rejects /RTC1, incremental linking and shadow stacks, and its binaries are
  # never packaged. Excluded in addition to the list above: the crash-report
  # test, whose deliberate access violations the sanitizer takes before the
  # application's own handler sees them.
  # Not required yet (continue-on-error): make it required once it has stayed
  # green on the hosted image.
  sanitize:
    name: Address sanitizer (windows-2022)
    runs-on: windows-2022
    continue-on-error: true
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build-asan
          -G "Visual Studio 17 2022" -A x64
          -DEASNAP_WARNINGS_AS_ERRORS=ON
          -DEASNAP_BUILD_TESTS=ON
          -DEASNAP_SANITIZE_ADDRESS=ON

      - name: Build
        shell: pwsh
        run: cmake --build build-asan --config Release --parallel

      - name: Test under the sanitizer
        shell: pwsh
        run: |
          # The sanitizer runtime is a DLL beside the compiler.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $runtime = & $vswhere -latest -products * -find 'VC\Tools\MSVC\*\bin\Hostx64\x64\clang_rt.asan_dynamic-x86_64.dll' | Select-Object -Last 1
          if (-not $runtime) { throw 'The AddressSanitizer runtime was not found.' }
          $env:PATH = (Split-Path -Parent $runtime) + ';' + $env:PATH
          ctest --test-dir build-asan --build-config Release --output-on-failure --parallel 4 --no-tests=error `
            --label-exclude "interactive-desktop|desktop-visual|soak|preview" `
            --exclude-regex "^(capture_overlay_interaction|diagnostics_log_and_crash_reports)$"
          if ($LASTEXITCODE -ne 0) { throw "Tests failed under AddressSanitizer (exit code $LASTEXITCODE)." }

  # The C++ sources follow .clang-format. The check uses the clang-format 19
  # that Visual Studio 2022 installs on this image, the major version the
  # tree was formatted with; scripts/format.ps1 refuses any other.
  format:
    name: Format (windows-2022)
    runs-on: windows-2022

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Check the C++ formatting
        shell: pwsh
        run: ./scripts/format.ps1 -Check

  # Static analysis with the checks in .clang-tidy. Report only for now: the
  # findings that remain were triaged as harmless (2026-11-07); make the job
  # required once they are gone. clang-tidy reads the compile commands of a
  # Ninja configure; nothing is built.
  tidy:
    name: clang-tidy (windows-2022, report only)
    runs-on: windows-2022
    continue-on-error: true

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Analyse the application sources
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $ninja = & $vswhere -latest -products * -find 'Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja\ninja.exe' | Select-Object -First 1
          $tidy = Join-Path $vs 'VC\Tools\Llvm\x64\bin\clang-tidy.exe'
          if (-not $ninja -or -not (Test-Path $tidy)) { throw 'Ninja or clang-tidy was not found in Visual Studio.' }
          & $tidy --version
          cmd /c "`"$vcvars`" >nul && cmake -S . -B build-tidy -G Ninja `"-DCMAKE_MAKE_PROGRAM=$ninja`" -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DEASNAP_BUILD_TESTS=ON"
          if ($LASTEXITCODE -ne 0) { throw "Configure failed (exit code $LASTEXITCODE)." }
          $files = @(git ls-files 'apps/easnap-desktop/src/*.cpp')
          $output = $files | ForEach-Object -ThrottleLimit 4 -Parallel {
            & $using:tidy -p build-tidy --quiet $_ 2>$null
          }
          $warnings = @($output | Select-String -Pattern 'warning:')
          $warnings | ForEach-Object { Write-Host $_.Line }
          Write-Host "$($warnings.Count) warnings in $($files.Count) files."
          if ($warnings.Count -gt 0) { exit 1 }

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      # Exact vetted assets/evidence are listed alongside the shared predicate.
      # New captures remain rejected even inside documentation/resource folders.
      - name: Reject committed capture files
        shell: bash
        run: |
          python3 scripts/check_repository_hygiene.py
          python3 scripts/test_repository_hygiene.py

      - name: Require the core documents
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            README.md \
            LICENSE \
            SECURITY.md \
            CONTRIBUTING.md \
            docs/architecture.md \
            docs/user-flows.md \
            docs/project-status.md \
            docs/testing.md \
            docs/decisions/ADR-001-overlay-rendering-gdi-not-d3d.md \
            docs/decisions/ADR-002-explicit-region-confirmation.md \
            docs/decisions/ADR-003-editor-window-and-export-model.md \
            docs/decisions/ADR-004-per-output-capture-fallback.md; do
            test -f "$file" || { echo "Missing required document: $file"; exit 1; }
          done
          echo "All required documents are present."
