name: Bug report
description: Something in Easnap does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time. Please use a test window or sample content when you
        reproduce the problem: do not attach private screenshots or recordings.
        For a security problem, use [private vulnerability reporting](https://github.com/vseprr/easnap/security/advisories/new) instead.
  - type: input
    id: version
    attributes:
      label: Easnap version
      description: Tray menu, About Easnap. For example 1.1.0-beta.1.
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: How did you get Easnap?
      options:
        - Installer (setup.exe)
        - Portable ZIP
        - Built from source
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and build
      description: Press Win+R, type winver. For example Windows 10 22H2, build 19045.4291.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: The steps that lead to the problem, one per line.
      placeholder: |
        1. Press Ctrl+Shift+A and drag a region
        2. Choose Scrollshot and press Start
        3. ...
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part is affected?
      options:
        - Screenshot and annotations
        - Scrollshot
        - Recording (MP4)
        - Recording (GIF)
        - Trim window and preview
        - Settings, shortcut or tray
        - Installer or portable package
        - Something else
    validations:
      required: true
  - type: input
    id: displays
    attributes:
      label: Displays
      description: Number of displays, their resolution and scale. For example two 1920x1080 at 125%.
  - type: input
    id: hardware
    attributes:
      label: Graphics card and audio device, if they could matter
  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        Attach `%LOCALAPPDATA%\Easnap\logs\easnap.log` (tray menu, Open data folder). Its lines contain
        no file names, window titles or typed text. If Easnap closed unexpectedly, a crash report is in
        `%LOCALAPPDATA%\Easnap\crashes`. A report can contain fragments of what Easnap was handling at
        that moment, so attach it only if you are comfortable with that.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: The attachments contain nothing private.
          required: true
        - label: I looked for an existing issue about the same problem.
          required: true
