# Workflow actions are pinned to commits. Dependabot proposes the new commit
# (and updates the version comment) when an action publishes a release.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      # init and analyze must move together: CodeQL refuses a run whose
      # init and analyze steps are at different versions.
      codeql-action:
        patterns:
          - "github/codeql-action*"
